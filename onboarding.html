<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#F7FBF8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Roz E Hisab — Get Started</title>

    <!-- Next-Gen Favicon Architecture -->
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="apple-touch-icon" href="assets/favicon.png">

    <!-- Precision Swiss Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@500;600;700&display=swap"
        rel="stylesheet">

    <style>
        /* ==========================================================================
           1. EXACT SCREENSHOT EMERALD ARCHITECTURE TOKENS
           ========================================================================== */
        :root {
            --canvas: #F7FBF8;
            --surface: #FFFFFF;
            --surface-glass: rgba(255, 255, 255, 0.88);

            /* Exact Screenshot Forest Green Gradient Palette */
            --forest-950: #02231A;
            --forest-900: #064E3B;
            --forest-800: #055944;
            --forest-700: #047857;
            --forest-600: #059669;
            --forest-500: #10B981;
            --forest-400: #34D399;
            --forest-200: #A7F3D0;
            --forest-100: #D1FAE5;
            --forest-50: #ECFDF5;

            --ink-headline: #04382A;
            --ink-body: #4A635A;
            --ink-tertiary: #92A79F;

            --border-subtle: rgba(6, 78, 59, 0.08);
            --btn-gradient: linear-gradient(180deg, #055944 0%, #03392B 100%);
            --btn-active: #02261C;

            --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-elastic: cubic-bezier(0.34, 1.56, 0.64, 1);

            --shadow-subtle: 0 4px 20px -2px rgba(6, 78, 59, 0.04);
            --shadow-btn: 0 16px 36px -8px rgba(5, 89, 68, 0.44), 0 2px 4px rgba(6, 78, 59, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--canvas);
            color: var(--ink-headline);
            position: fixed;
        }

        /* Ambient Organic Mesh Lighting */
        .ambient-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(100% 70% at 50% 0%, #FFFFFF 0%, rgba(240, 253, 244, 0.8) 55%, #F0FDF4 100%);
            z-index: 0;
            pointer-events: none;
        }

        .ambient-orb {
            position: fixed;
            width: 520px;
            height: 520px;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(52, 211, 153, 0.22) 0%, rgba(255, 255, 255, 0) 70%);
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
            animation: breatheHalo 8s ease-in-out infinite alternate;
        }

        @keyframes breatheHalo {
            0% {
                transform: translate(-50%, -50%) scale(0.92);
                opacity: 0.5;
            }

            100% {
                transform: translate(-50%, -50%) scale(1.15);
                opacity: 0.85;
            }
        }

        /* ==========================================================================
           2. CLEAN BESPOKE TOP NAVBAR (WITH LOGO & SKIP)
           ========================================================================== */
        .top-navbar {
            position: fixed;
            top: env(safe-area-inset-top, 16px);
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            z-index: 500;
            pointer-events: none;
        }

        .brand-badge {
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--surface-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 6px 14px 6px 8px;
            border-radius: 100px;
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-subtle);
            text-decoration: none;
        }

        .brand-logo-frame {
            width: 26px;
            height: 26px;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--forest-900);
        }

        .brand-logo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .brand-badge span {
            font-size: 12.5px;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--forest-900);
        }

        .btn-skip {
            pointer-events: auto;
            background: var(--surface-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-subtle);
            border-radius: 100px;
            padding: 6px 16px;
            font-size: 13px;
            font-weight: 700;
            color: var(--ink-body);
            cursor: pointer;
            box-shadow: var(--shadow-subtle);
            transition: all 0.25s var(--ease-spring);
        }

        .btn-skip:hover {
            color: var(--forest-900);
            background: #FFFFFF;
        }

        .btn-skip:active {
            transform: scale(0.95);
        }

        /* ==========================================================================
           3. MASTER SLIDER CHASSIS
           ========================================================================== */
        .stage-viewport {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            max-width: 480px;
            margin: 0 auto;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding-top: calc(env(safe-area-inset-top, 20px) + 55px);
            padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 24px);
        }

        .slider-track {
            display: flex;
            width: 300%;
            height: calc(100% - 110px);
            transition: transform 0.52s var(--ease-spring);
            touch-action: pan-y;
            will-change: transform;
            cursor: grab;
        }

        .slider-track:active {
            cursor: grabbing;
        }

        .slide-screen {
            width: 33.333333%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 10px 24px 16px 24px;
            text-align: center;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ==========================================================================
           4. ARTISANAL 1:1 VECTOR ART CONTAINERS
           ========================================================================== */
        .illustration-stage {
            flex: 1;
            width: 100%;
            max-height: 52vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .illustration-glow-pod {
            position: absolute;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(167, 243, 208, 0.45) 0%, rgba(236, 253, 245, 0.1) 65%, transparent 70%);
            filter: blur(14px);
            z-index: 0;
        }

        .hero-svg-art {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 310px;
            height: auto;
            max-height: 280px;
            filter: drop-shadow(0 14px 28px rgba(6, 78, 59, 0.08));
            animation: floatArt 6s ease-in-out infinite alternate;
        }

        @keyframes floatArt {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(-7px);
            }
        }

        /* ==========================================================================
           5. EXACT TYPOGRAPHIC SPECIFICATIONS
           ========================================================================== */
        .slide-text-block {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 0 8px;
            margin-top: 12px;
            margin-bottom: 8px;
            animation: fadeInUp 0.65s var(--ease-spring);
        }

        .slide-headline {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.04em;
            color: var(--ink-headline);
            line-height: 1.22;
            max-width: 320px;
        }

        .slide-subtext {
            font-size: 14.5px;
            font-weight: 500;
            color: var(--ink-body);
            line-height: 1.54;
            max-width: 300px;
            letter-spacing: -0.01em;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ==========================================================================
           6. FIXED BOTTOM CONTROLS DOCK (DOTS & CTA BUTTON)
           ========================================================================== */
        .bottom-dock {
            width: 100%;
            padding: 0 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
            z-index: 50;
        }

        /* Pagination Dots from Screenshot */
        .pagination-capsule {
            display: flex;
            align-items: center;
            gap: 8px;
            height: 12px;
        }

        .dot-node {
            width: 7.5px;
            height: 7.5px;
            border-radius: 999px;
            background: #CBE0D8;
            transition: width 0.4s var(--ease-elastic), background-color 0.3s ease;
            cursor: pointer;
        }

        .dot-node.active {
            width: 7.5px;
            background: var(--forest-900);
        }

        /* Screenshot Exact Green Button */
        .btn-dock-cta {
            position: relative;
            width: 100%;
            height: 54px;
            border: none;
            border-radius: 14px;
            background: var(--btn-gradient);
            color: #FFFFFF;
            font-size: 15.5px;
            font-weight: 700;
            letter-spacing: -0.01em;
            cursor: pointer;
            box-shadow: var(--shadow-btn);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s var(--ease-spring);
        }

        .btn-dock-cta:hover {
            transform: translateY(-1.5px);
            box-shadow: 0 20px 40px -8px rgba(5, 89, 68, 0.54);
        }

        .btn-dock-cta:active {
            transform: scale(0.98);
            background: var(--btn-active);
        }

        .stage-exit {
            opacity: 0 !important;
            transform: scale(0.97) !important;
            transition: all 0.4s var(--ease-spring) !important;
        }
    </style>
</head>

<body>

    <!-- ==========================================================================
       7. NATIVE TOUCH SWIPE, SOUND SYNTHESIS & ROUTING ENGINE
       ========================================================================== -->
    <script>
        // DOM Handles
        const sliderTrack = document.getElementById('sliderTrack');
        const dotNodes = document.querySelectorAll('.dot-node');
        const ctaBtn = document.getElementById('ctaBtn');
        const ctaLabel = document.getElementById('ctaLabel');
        const skipBtn = document.getElementById('skipBtn');
        const stageViewport = document.getElementById('stageViewport');

        let activeIndex = 0;
        const totalScreens = 3;

        // Subtle Synthesized Audio
        let audioCtx = null;
        function playPip(isSuccess = false) {
            try {
                if (!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) audioCtx = new AudioContext();
                }
                if (!audioCtx) return;
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                if (!isSuccess) {
                    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + 0.04);
                    gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.045);
                } else {
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(659.25, audioCtx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.13);
                }
            } catch (e) { }
        }

        function triggerHaptic() {
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(15);
            }
        }

        // Slide Navigation
        function navigateToSlide(index, playAudio = true) {
            if (index < 0 || index >= totalScreens) return;
            activeIndex = index;

            sliderTrack.style.transform = `translateX(-${activeIndex * 33.333333}%)`;

            dotNodes.forEach((dot, idx) => {
                dot.classList.toggle('active', idx === activeIndex);
            });

            if (activeIndex === totalScreens - 1) {
                ctaLabel.innerText = "Get Started";
            } else {
                ctaLabel.innerText = "Next";
            }

            if (playAudio) {
                playPip(activeIndex === totalScreens - 1);
                triggerHaptic();
            }
        }

        // Exit Onboarding & Complete
        function exitOnboarding() {
            playPip(true);
            triggerHaptic();

            localStorage.setItem("ROZ_ONBOARDED_V2", "true");
            stageViewport.classList.add('stage-exit');

            setTimeout(() => {
                window.location.href = "login.html";
            }, 360);
        }

        // Event Listeners
        ctaBtn.addEventListener('click', () => {
            if (activeIndex < totalScreens - 1) {
                navigateToSlide(activeIndex + 1);
            } else {
                exitOnboarding();
            }
        });

        skipBtn.addEventListener('click', exitOnboarding);

        dotNodes.forEach(dot => {
            dot.addEventListener('click', () => {
                const targetSlide = parseInt(dot.getAttribute('data-slide'));
                navigateToSlide(targetSlide);
            });
        });

        // 1:1 Physical Touch Swipe
        let touchOriginX = 0;
        let currentTouchX = 0;
        let isTouching = false;

        sliderTrack.addEventListener('touchstart', (e) => {
            touchOriginX = e.touches[0].clientX;
            currentTouchX = touchOriginX;
            isTouching = true;
            sliderTrack.style.transition = 'none';
        }, { passive: true });

        sliderTrack.addEventListener('touchmove', (e) => {
            if (!isTouching) return;
            currentTouchX = e.touches[0].clientX;
            const deltaX = currentTouchX - touchOriginX;

            const baseShift = -(activeIndex * (100 / 3));
            const dragPercent = (deltaX / window.innerWidth) * (100 / 3);
            const isAtEdge = (activeIndex === 0 && deltaX > 0) || (activeIndex === totalScreens - 1 && deltaX < 0);
            const resistance = isAtEdge ? 0.28 : 1;

            sliderTrack.style.transform = `translateX(${baseShift + (dragPercent * resistance)}%)`;
        }, { passive: true });

        sliderTrack.addEventListener('touchend', () => {
            if (!isTouching) return;
            isTouching = false;
            sliderTrack.style.transition = 'transform 0.52s var(--ease-spring)';

            const totalDelta = currentTouchX - touchOriginX;
            if (totalDelta < -48 && activeIndex < totalScreens - 1) {
                navigateToSlide(activeIndex + 1);
            } else if (totalDelta > 48 && activeIndex > 0) {
                navigateToSlide(activeIndex - 1);
            } else {
                navigateToSlide(activeIndex, false);
            }
        });

        // Mouse Drag for Desktop
        let isMouseDown = false;
        sliderTrack.addEventListener('mousedown', (e) => {
            touchOriginX = e.clientX;
            currentTouchX = touchOriginX;
            isMouseDown = true;
            sliderTrack.style.transition = 'none';
        });

        window.addEventListener('mousemove', (e) => {
            if (!isMouseDown) return;
            currentTouchX = e.clientX;
            const deltaX = currentTouchX - touchOriginX;
            const baseShift = -(activeIndex * (100 / 3));
            const dragPercent = (deltaX / window.innerWidth) * (100 / 3);
            sliderTrack.style.transform = `translateX(${baseShift + dragPercent}%)`;
        });

        window.addEventListener('mouseup', () => {
            if (!isMouseDown) return;
            isMouseDown = false;
            sliderTrack.style.transition = 'transform 0.52s var(--ease-spring)';
            const delta = currentTouchX - touchOriginX;
            if (delta < -50 && activeIndex < totalScreens - 1) {
                navigateToSlide(activeIndex + 1);
            } else if (delta > 50 && activeIndex > 0) {
                navigateToSlide(activeIndex - 1);
            } else {
                navigateToSlide(activeIndex, false);
            }
        });
    </script>
