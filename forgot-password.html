<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#F7FBF8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Roz E Hisab — Reset Password</title>

    <!-- Next-Gen Favicon Architecture -->
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="apple-touch-icon" href="assets/favicon.png">

    <!-- Global Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap"
        rel="stylesheet">

    <style>
        /* ==========================================================================
           1. EXACT SCREENSHOT FOREST & MINT DESIGN TOKENS
           ========================================================================== */
        :root {
            --canvas: #F7FBF8;
            --surface: #FFFFFF;
            --surface-input: #FFFFFF;
            --surface-subtle: #F0FDF4;

            /* Forest Green Gradient Palette */
            --forest-950: #02231A;
            --forest-900: #064E3B;
            --forest-800: #055944;
            --forest-700: #047857;
            --forest-600: #059669;
            --forest-500: #10B981;
            --forest-100: #D1FAE5;
            --forest-50: #ECFDF5;

            --ink-headline: #04382A;
            --ink-title: #090D14;
            --ink-body: #64748B;
            --ink-placeholder: #94A3B8;

            --border-input: #E2E8E4;
            --border-focus: #059669;

            --btn-gradient: linear-gradient(180deg, #055944 0%, #03392B 100%);
            --btn-active: #02261C;

            --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);

            --shadow-btn: 0 14px 28px -6px rgba(5, 89, 68, 0.38);
            --shadow-toast: 0 18px 36px -6px rgba(15, 23, 42, 0.16);
            --shadow-badge: 0 12px 24px -6px rgba(5, 150, 105, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background-color: var(--canvas);
            color: var(--ink-headline);
            overflow-x: hidden;
        }

        /* Subtle Ambient Lighting */
        .ambient-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(100% 70% at 50% 0%, #FFFFFF 0%, rgba(240, 253, 244, 0.6) 60%, #F7FBF8 100%);
            z-index: 0;
            pointer-events: none;
        }

        /* ==========================================================================
           2. DISCREET FLOATING TOAST (BACKGROUND NETWORK & ERROR FEEDBACK)
           ========================================================================== */
        .toast-wrapper {
            position: fixed;
            top: env(safe-area-inset-top, 20px);
            left: 50%;
            transform: translateX(-50%) translateY(-24px);
            opacity: 0;
            visibility: hidden;
            z-index: 1000;
            transition: all 0.35s var(--ease-spring);
            pointer-events: none;
            width: 90%;
            max-width: 400px;
        }

        .toast-wrapper.active {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        .toast-capsule {
            background: rgba(15, 23, 42, 0.94);
            color: #FFFFFF;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 12px 18px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow-toast);
            font-size: 13.5px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .toast-capsule svg {
            flex-shrink: 0;
            width: 18px;
            height: 18px;
        }

        /* ==========================================================================
           3. MAIN RECOVERY CONTAINER
           ========================================================================== */
        .viewport-wrapper {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: calc(env(safe-area-inset-top, 24px) + 20px) 24px calc(env(safe-area-inset-bottom, 24px) + 20px) 24px;
        }

        .recovery-card {
            width: 100%;
            max-width: 410px;
            display: flex;
            flex-direction: column;
            animation: cardEntrance 0.7s var(--ease-spring) forwards;
        }

        @keyframes cardEntrance {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Brand Emblem Box */
        .brand-header-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 24px;
            text-align: center;
        }

        .app-logo-box {
            width: 66px;
            height: 66px;
            border-radius: 20px;
            background: linear-gradient(135deg, #055944 0%, #03392B 100%);
            box-shadow: 0 12px 24px -4px rgba(6, 78, 59, 0.28);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
            overflow: hidden;
        }

        .app-logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .brand-wordmark {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.035em;
            color: var(--forest-900);
            line-height: 1.1;
        }

        /* Headline Block */
        .header-block {
            width: 100%;
            text-align: left;
            margin-bottom: 22px;
        }

        .header-title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--ink-headline);
            margin-bottom: 4px;
        }

        .header-subtitle {
            font-size: 13.5px;
            font-weight: 500;
            color: var(--ink-body);
            letter-spacing: -0.01em;
            line-height: 1.45;
        }

        /* Input Apparatus */
        .auth-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .input-group {
            position: relative;
            width: 100%;
            height: 52px;
            background: var(--surface-input);
            border: 1.5px solid var(--border-input);
            border-radius: 14px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            transition: all 0.22s var(--ease-smooth);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.015);
        }

        .input-group:focus-within {
            border-color: var(--border-focus);
            background: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(5, 150, 105, 0.12);
        }

        .input-icon {
            width: 20px;
            height: 20px;
            color: var(--ink-placeholder);
            flex-shrink: 0;
            margin-right: 12px;
            transition: color 0.2s ease;
        }

        .input-group:focus-within .input-icon {
            color: var(--forest-700);
        }

        .field-core {
            flex: 1;
            height: 100%;
            border: none;
            background: transparent;
            outline: none;
            font-size: 14.5px;
            font-weight: 600;
            color: var(--ink-headline);
        }

        .field-core::placeholder {
            color: var(--ink-placeholder);
            font-weight: 400;
        }

        /* Forest Green Action Button */
        .btn-action-submit {
            position: relative;
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 14px;
            background: var(--btn-gradient);
            color: #FFFFFF;
            font-size: 15.5px;
            font-weight: 700;
            letter-spacing: -0.01em;
            cursor: pointer;
            box-shadow: var(--shadow-btn);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 4px;
            transition: all 0.25s var(--ease-spring);
        }

        .btn-action-submit:hover {
            transform: translateY(-1.5px);
            box-shadow: 0 18px 36px -6px rgba(5, 89, 68, 0.52);
        }

        .btn-action-submit:active {
            transform: scale(0.98);
            background: var(--btn-active);
        }

        .btn-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #FFFFFF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Secondary Button (Resend) */
        .btn-secondary-action {
            width: 100%;
            height: 50px;
            background: #FFFFFF;
            border: 1.5px solid var(--border-input);
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            color: var(--ink-body);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .btn-secondary-action:hover {
            background: #FBFDFB;
            border-color: #CBD5E1;
            color: var(--ink-headline);
        }

        /* Return Link */
        .return-footer {
            margin-top: 24px;
            text-align: center;
        }

        .return-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--forest-700);
            font-size: 13.5px;
            font-weight: 700;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .return-link:hover {
            color: var(--forest-950);
            text-decoration: underline;
        }

        /* ==========================================================================
           4. STAGE 2: TRANSMISSION SUCCESS TERMINAL
           ========================================================================== */
        .success-terminal {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: cardEntrance 0.6s var(--ease-spring) forwards;
        }

        .success-badge-icon {
            width: 68px;
            height: 68px;
            border-radius: 22px;
            background: var(--forest-50);
            border: 1.5px solid var(--forest-100);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 18px;
            color: var(--forest-600);
            box-shadow: var(--shadow-badge);
        }

        .success-badge-icon svg {
            width: 32px;
            height: 32px;
        }

        .target-email-pill {
            display: inline-block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 700;
            color: var(--forest-800);
            background: var(--forest-50);
            padding: 6px 14px;
            border-radius: 10px;
            border: 1px solid var(--forest-100);
            margin: 12px 0 24px 0;
            word-break: break-all;
        }

        .action-button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }
    </style>
</head>

<body>

    <!-- Ambient Subtle Background -->
    <div class="ambient-canvas"></div>

    <!-- Floating Background Toast Notification -->
    <div class="toast-wrapper" id="toastBox">
        <div class="toast-capsule">
            <svg id="toastIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span id="toastMsg">Notification message</span>
        </div>
    </div>

    <!-- Master Viewport Container -->
    <main class="viewport-wrapper">

        <div class="recovery-card">

            <!-- App Logo Header -->
            <div class="brand-header-group">
                <div class="app-logo-box">
                    <img src="assets/logo.png"
                        onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\' fill=\'none\'><rect width=\'100\' height=\'100\' rx=\'28\' fill=\'%23064E3B\'/><path d=\'M28 50L44 66L74 34\' stroke=\'white\' stroke-width=\'10\' stroke-linecap=\'round\' stroke-linejoin=\'round\'/></svg>';"
                        alt="Roz E Hisab Logo">
                </div>
                <h1 class="brand-wordmark">Roz E Hisab</h1>
            </div>

            <!-- STAGE 1: RECOVERY DISPATCH FORM -->
            <div id="requestStage">

                <div class="header-block">
                    <h2 class="header-title">Reset Your Password</h2>
                    <p class="header-subtitle">Enter your registered email and we will dispatch an encrypted reset link.
                    </p>
                </div>

                <form class="auth-form" id="recoveryForm" novalidate>

                    <div class="input-group">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z">
                            </path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                        <input type="email" id="recoveryEmail" class="field-core" placeholder="Registered Email Address"
                            required autocomplete="email">
                    </div>

                    <button type="submit" class="btn-action-submit" id="submitBtn">
                        <span id="btnLabel">Send Recovery Link</span>
                        <div class="btn-spinner" id="btnSpinner"></div>
                    </button>

                </form>

                <div class="return-footer">
                    <a href="login.html" class="return-link">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                        <span>Return to Login</span>
                    </a>
                </div>

            </div>

            <!-- STAGE 2: TRANSMISSION SUCCESS TERMINAL -->
            <div id="successStage" class="success-terminal">

                <div class="success-badge-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                </div>

                <h2 class="header-title" style="text-align: center;">Reset Link Dispatched</h2>
                <p class="header-subtitle" style="text-align: center;">Cryptographic password reset instructions have
                    been transmitted to:</p>
                <div class="target-email-pill" id="confirmedEmailBadge">user@example.com</div>

                <div class="action-button-group">
                    <button type="button" class="btn-action-submit" onclick="window.location.href='login.html'">
                        Proceed to Login
                    </button>
                    <button type="button" class="btn-secondary-action" id="resendBtn">
                        Resend in <span id="timerCountdown" style="margin-left: 4px;">60s</span>
                    </button>
                </div>

            </div>

        </div>

    </main>

    <!-- ==========================================================================
       5. FIREBASE RECOVERY ORCHESTRATION ENGINE (VIA FIREBASE-CONFIG.JS)
       ========================================================================== -->
    <script type="module">
        import { auth } from './firebase/firebase-config.js';
        import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";

        // DOM Handles
        const requestStage = document.getElementById('requestStage');
        const successStage = document.getElementById('successStage');
        const recoveryForm = document.getElementById('recoveryForm');
        const recoveryEmail = document.getElementById('recoveryEmail');
        const submitBtn = document.getElementById('submitBtn');
        const btnLabel = document.getElementById('btnLabel');
        const btnSpinner = document.getElementById('btnSpinner');
        const confirmedEmailBadge = document.getElementById('confirmedEmailBadge');
        const resendBtn = document.getElementById('resendBtn');
        const timerCountdown = document.getElementById('timerCountdown');
        const toastBox = document.getElementById('toastBox');
        const toastMsg = document.getElementById('toastMsg');

        let cooldownSeconds = 60;
        let cooldownInterval = null;

        // Non-Obtrusive Toast Engine
        let toastTimer;
        function notify(message, isError = true) {
            clearTimeout(toastTimer);
            toastMsg.innerText = message;
            toastBox.querySelector('.toast-capsule').style.background = isError
                ? "rgba(185, 28, 28, 0.95)"
                : "rgba(6, 78, 59, 0.95)";
            toastBox.classList.add('active');
            toastTimer = setTimeout(() => {
                toastBox.classList.remove('active');
            }, 3600);
        }

        function setLoading(isLoading) {
            if (isLoading) {
                btnLabel.style.display = "none";
                btnSpinner.style.display = "block";
                submitBtn.disabled = true;
            } else {
                btnLabel.style.display = "block";
                btnSpinner.style.display = "none";
                submitBtn.disabled = false;
            }
        }

        // Resend 60s Countdown Timer
        function startCooldown() {
            cooldownSeconds = 60;
            resendBtn.disabled = true;
            resendBtn.style.opacity = "0.6";
            resendBtn.style.cursor = "not-allowed";

            clearInterval(cooldownInterval);
            cooldownInterval = setInterval(() => {
                cooldownSeconds--;
                timerCountdown.innerText = `${cooldownSeconds}s`;

                if (cooldownSeconds <= 0) {
                    clearInterval(cooldownInterval);
                    resendBtn.disabled = false;
                    resendBtn.style.opacity = "1";
                    resendBtn.style.cursor = "pointer";
                    resendBtn.innerText = "Resend Recovery Email";
                }
            }, 1000);
        }

        // Send Reset Email Function
        async function executeReset(emailTarget) {
            if (!navigator.onLine) {
                notify("Network offline. Please connect to internet to proceed.");
                return false;
            }

            setLoading(true);

            try {
                await sendPasswordResetEmail(auth, emailTarget);
                setLoading(false);
                return true;
            } catch (err) {
                setLoading(false);
                let message = "Unable to dispatch recovery link.";
                if (err.code === 'auth/user-not-found') {
                    message = "No account found matching this email address.";
                } else if (err.code === 'auth/invalid-email') {
                    message = "Please enter a valid email address.";
                } else if (err.code === 'auth/too-many-requests') {
                    message = "Exceeded request quota. Please wait before retrying.";
                }
                notify(message);
                return false;
            }
        }

        // Form Submit Handler
        recoveryForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = recoveryEmail.value.trim();

            if (!email) {
                notify("Please provide your account email.");
                return;
            }

            const success = await executeReset(email);
            if (success) {
                confirmedEmailBadge.innerText = email;
                requestStage.style.display = "none";
                successStage.style.display = "flex";
                startCooldown();
                notify("Reset link dispatched successfully!", false);
            }
        });

        // Resend Button Click Handler
        resendBtn.addEventListener('click', async () => {
            if (cooldownSeconds > 0) return;
            const email = confirmedEmailBadge.innerText;
            const success = await executeReset(email);
            if (success) {
                startCooldown();
                notify("New recovery link dispatched!", false);
            }
        });
    </script>
</body>

</html>
